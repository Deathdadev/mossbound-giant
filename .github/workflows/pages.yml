name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Publish the built bundle on gh-pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 4188199+github-actions[bot]@users.noreply.github.com
          git checkout --orphan gh-pages
          git rm --cached -r -q .
          git add -f -- dist
          git commit -m "Publish screening room"
          git push -f origin gh-pages:gh-pages
